<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Composer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 16px;
        }

        textarea {
            height: 180px;
            resize: vertical;
        }

        #counter {
            text-align: right;
            margin-top: 5px;
            color: #555;
        }

        #error {
            color: red;
            margin-top: 10px;
        }

        #success {
            color: green;
            margin-top: 10px;
        }

        button {
            padding: 10px 18px;
            margin-top: 15px;
            margin-right: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .save {
            background: #2196f3;
            color: white;
        }

        .clear {
            background: #777;
            color: white;
        }

        .delete {
            background: #e53935;
            color: white;
        }

        .draft {
            margin-top: 15px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Social Media Post Composer</h1>

    <label for="platform">Select Platform:</label>

    <select id="platform">
        <option value="twitter">Twitter</option>
        <option value="linkedin">LinkedIn</option>
        <option value="instagram">Instagram</option>
    </select>

    <label for="content">Write Your Post:</label>

    <textarea id="content"
        placeholder="Write your post here..."></textarea>

    <div id="counter">0 / 280 characters</div>

    <div id="error"></div>
    <div id="success"></div>

    <button class="save" onclick="saveDraft()">Save Draft</button>
    <button class="clear" onclick="clearPost()">Clear</button>

    <h2>Saved Drafts</h2>

    <div id="draftList"></div>

</div>


<script>

    // Platform character limits
    const limits = {
        twitter: 280,
        linkedin: 3000,
        instagram: 2200
    };

    const platform = document.getElementById("platform");
    const content = document.getElementById("content");
    const counter = document.getElementById("counter");
    const error = document.getElementById("error");
    const success = document.getElementById("success");
    const draftList = document.getElementById("draftList");


    // Update character counter
    function updateCounter() {

        let selectedPlatform = platform.value;
        let maxLength = limits[selectedPlatform];

        let currentLength = content.value.length;

        counter.innerHTML =
            currentLength + " / " + maxLength + " characters";

        // Validation
        if (currentLength > maxLength) {

            counter.style.color = "red";

            error.innerHTML =
                "Error: Post exceeds " + maxLength + " characters.";

        } else {

            counter.style.color = "green";
            error.innerHTML = "";
        }
    }


    // Change platform
    platform.addEventListener("change", function () {

        updateCounter();

    });


    // Real-time validation
    content.addEventListener("input", function () {

        updateCounter();

    });


    // Save draft
    function saveDraft() {

        let text = content.value.trim();

        if (text === "") {

            error.innerHTML = "Please write something first.";
            success.innerHTML = "";

            return;
        }

        let maxLength = limits[platform.value];

        if (text.length > maxLength) {

            error.innerHTML =
                "Cannot save. Post exceeds the character limit.";

            success.innerHTML = "";

            return;
        }

        // Get old drafts
        let drafts =
            JSON.parse(localStorage.getItem("drafts")) || [];

        // Add new draft
        drafts.push({
            platform: platform.value,
            content: text
        });

        // Save in localStorage
        localStorage.setItem(
            "drafts",
            JSON.stringify(drafts)
        );

        success.innerHTML = "Draft saved successfully!";
        error.innerHTML = "";

        displayDrafts();
    }


    // Display drafts
    function displayDrafts() {

        let drafts =
            JSON.parse(localStorage.getItem("drafts")) || [];

        draftList.innerHTML = "";

        drafts.forEach(function(draft, index) {

            let div = document.createElement("div");

            div.className = "draft";

            div.innerHTML = `
                <b>${draft.platform.toUpperCase()}</b>
                <p>${draft.content}</p>

                <button onclick="editDraft(${index})">
                    Edit
                </button>

                <button class="delete"
                        onclick="deleteDraft(${index})">
                    Delete
                </button>
            `;

            draftList.appendChild(div);
        });
    }


    // Edit draft
    function editDraft(index) {

        let drafts =
            JSON.parse(localStorage.getItem("drafts")) || [];

        platform.value = drafts[index].platform;

        content.value = drafts[index].content;

        updateCounter();

        deleteDraft(index);
    }


    // Delete draft
    function deleteDraft(index) {

        let drafts =
            JSON.parse(localStorage.getItem("drafts")) || [];

        drafts.splice(index, 1);

        localStorage.setItem(
            "drafts",
            JSON.stringify(drafts)
        );

        displayDrafts();
    }


    // Clear post
    function clearPost() {

        content.value = "";

        error.innerHTML = "";
        success.innerHTML = "";

        updateCounter();
    }


    // Load saved drafts when page opens
    displayDrafts();

    updateCounter();

</script>

</body>
</html>
